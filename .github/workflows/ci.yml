name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check for committed secrets
        shell: bash
        run: |
          secret_patterns='(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16})'
          if git grep -nI -E "$secret_patterns" -- . ':(exclude).github/workflows/ci.yml'; then
            echo "Potential secret detected in tracked files. Remove it and rotate the key before pushing again."
            exit 1
          fi

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build client
        run: ant -noinput bin

      - name: Run unit tests if configured
        run: |
          if ant -projecthelp -verbose | grep -qE '^[[:space:]]+test[[:space:]]'; then
            ant -noinput test
          else
            echo "No Ant test target is configured yet."
          fi
